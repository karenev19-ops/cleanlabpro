<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanLabPro - Solicita tu servicio de limpieza</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a1f3f 0%, #1a3a6e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #0a1f3f 0%, #1a3a6e 100%);
            padding: 40px 20px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 200px;
            height: auto;
            display: block;
            margin: 0 auto;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            color: white;
            font-size: 24px;
            font-weight: 600;
            margin-top: 10px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-top: 8px;
        }

        .content {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }
        .form-group:nth-child(6) { animation-delay: 0.6s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                opacity: 0;
                transform: translateY(10px);
            }
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a3a6e;
            font-size: 14px;
        }

        .form-group label span {
            color: #d32f2f;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #1D9E75;
            box-shadow: 0 0 0 3px rgba(29, 158, 117, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1D9E75 0%, #0F6E56 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(29, 158, 117, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .submit-btn.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            right: 20px;
            margin-top: -10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .message.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
            display: block;
            animation: slideDown 0.4s ease-out;
        }

        .message.error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
            display: block;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .footer-text a {
            color: #1D9E75;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .content {
                padding: 25px 20px;
            }

            .header {
                padding: 30px 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .logo-container img {
                max-width: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="CleanLabPro" id="logo">
            </div>
            <h1>CleanLabPro</h1>
            <p>Tapetes • Salas • Colchones</p>
        </div>

        <div class="content">
            <form id="contactForm">
                <div class="form-group">
                    <label for="nombre">Nombre completo <span>*</span></label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        placeholder="Juan Pérez" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="whatsapp">WhatsApp <span>*</span></label>
                    <input 
                        type="tel" 
                        id="whatsapp" 
                        name="whatsapp" 
                        placeholder="+52 1234567890" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="ciudad">Ciudad <span>*</span></label>
                    <input 
                        type="text" 
                        id="ciudad" 
                        name="ciudad" 
                        placeholder="Guadalajara" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="servicio">¿Qué deseas limpiar? <span>*</span></label>
                    <select id="servicio" name="servicio" required>
                        <option value="">-- Selecciona un servicio --</option>
                        <option value="Tapete">Tapete</option>
                        <option value="Sala">Sala</option>
                        <option value="Colchón">Colchón</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="detalles">Detalles o comentarios</label>
                    <textarea 
                        id="detalles" 
                        name="detalles" 
                        placeholder="Cuéntanos sobre el estado y medidas del producto..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <button type="submit" class="submit-btn">
                        Solicitar servicio
                    </button>
                </div>

                <div class="message" id="message"></div>

                <p class="footer-text">
                    Tus datos están seguros y protegidos
                </p>
            </form>
        </div>
    </div>

    <script>
        // Cargar logo desde archivo subido
        const logoImg = document.getElementById('logo');
        logoImg.src = 'https://drive.google.com/uc?export=download&id=YOUR_LOGO_ID'; // Se actualiza después

        const form = document.getElementById('contactForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = form.querySelector('.submit-btn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Validación básica
            const nombre = document.getElementById('nombre').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            const ciudad = document.getElementById('ciudad').value.trim();
            const servicio = document.getElementById('servicio').value.trim();
            const detalles = document.getElementById('detalles').value.trim();

            if (!nombre || !whatsapp || !ciudad || !servicio) {
                showMessage('Por favor completa todos los campos obligatorios', 'error');
                return;
            }

            // Mostrar estado de carga
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                // Enviar a Google Apps Script
                const response = await fetch('SCRIPT_URL', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        nombre: nombre,
                        whatsapp: whatsapp,
                        ciudad: ciudad,
                        servicio: servicio,
                        detalles: detalles,
                        fecha: new Date().toLocaleDateString('es-MX'),
                        hora: new Date().toLocaleTimeString('es-MX')
                    })
                });

                if (response.ok) {
                    showMessage('✓ ¡Solicitud registrada! Te contactaremos pronto', 'success');
                    form.reset();
                    
                    // Enviar también a WhatsApp si quieres
                    const mensaje = `Hola! Recibimos tu solicitud:%0A%0ANombre: ${nombre}%0AServicio: ${servicio}%0ACiudad: ${ciudad}%0A%0aTe contactaremos pronto.`;
                    // Descomentar si quieres enviar WhatsApp automático:
                    // window.open(`https://wa.me/${whatsapp.replace(/\D/g, '')}?text=${mensaje}`);
                } else {
                    showMessage('Error al registrar. Intenta de nuevo.', 'error');
                }
            } catch (error) {
                showMessage('Error de conexión. Verifica tu formulario.', 'error');
                console.error('Error:', error);
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 4000);
            }
        }

        // Cambiar a tu logo
        window.setCleanLabProLogo = function(googleDriveId) {
            logoImg.src = `https://drive.google.com/uc?export=download&id=${googleDriveId}`;
        };
    </script>
</body>
</html>
